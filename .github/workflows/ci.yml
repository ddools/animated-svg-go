name: CI

# PRs run everything. A merge to main only re-runs lint, unit and the build guard:
# the PR already ran the browser suites. Docs-only changes skip CI.
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # VERCEL=1 builds as Vercel does, with analytics in, so the CSP check sees what production serves.
      - name: Production build has no test hooks, and its CSP is in <head>
        run: VERCEL=1 pnpm build && ! grep -rq __asg dist && node tests/security/csp-head.mjs
      # The editor island also builds into the VS Code extension. The smoke run needs a local VS Code, so it stays on Der's Mac.
      - name: VS Code extension packages, with no test hooks
        run: pnpm ext:package && ! grep -rq __asg extension/media

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e --forbid-only --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/

  corpus:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report
          path: tests/corpus/report/

  parity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm parity --forbid-only
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-report
          path: playwright-report/
